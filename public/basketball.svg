<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Basketball">
  <!-- Orange basketball background -->
  <circle cx="50" cy="50" r="50" fill="#f97316"/>
  <!-- Basketball seam lines in dark orange/brown -->
  <!-- Vertical centre line -->
  <line x1="50" y1="0" x2="50" y2="100" stroke="#c2440f" stroke-width="3"/>
  <!-- Horizontal centre line -->
  <line x1="0" y1="50" x2="100" y2="50" stroke="#c2440f" stroke-width="3"/>
  <!-- Left curved seam -->
  <path d="M 50 0 Q 10 25 10 50 Q 10 75 50 100" fill="none" stroke="#c2440f" stroke-width="3"/>
  <!-- Right curved seam -->
  <path d="M 50 0 Q 90 25 90 50 Q 90 75 50 100" fill="none" stroke="#c2440f" stroke-width="3"/>
</svg>
